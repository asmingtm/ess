<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Style Sheet</title>
    <link rel="stylesheet" href="index.css">
    <script type="module" src="index.js"></script>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body class="flexy center">
    <form class="block">
        <h3 class="label">Account</h3>
        <label for="name" class="field">
            <p class="placeholder">Name</p>
            <input id="name" required type="text">
        </label>
        <label for="username" class="field">
            <p class="placeholder">Username</p>
            <input id="username" required type="text">
        </label>
        <label for="password" class="field">
            <p class="placeholder">Password</p>
            <input id="password" required type="text">
        </label>
        <label for="cpassword" class="field">
            <p class="placeholder">Confirm password</p>
            <input id="cpassword" required type="text">
        </label>
        <label class="topic" for="terms">
            <p class="label">You wish to recieve news letters?</p>
            <label for="terms" class="checkbox">
                <input type="checkbox" id="terms">
            </label>
        </label>
        <button type="button" class="primary mart">Register</button>
        <a href="?register" class="link">
            <p class="label">Already have an account?</p>
            <p class="link">Login</p>
            <p class="label">instead!</p>
        </a>
    </form>
</body>
</html
